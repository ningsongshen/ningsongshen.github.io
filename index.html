<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ningsong Shen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background-color: #0e0e0e;
      font-family: 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    .ribbons {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .ribbon {
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: white;
      font-weight: 300;
      line-height: 1;
    }

    .scroll {
      display: inline-block;
      white-space: nowrap;
      padding-right: 2rem;
      animation: scroll 30s linear infinite;
    }

    .scroll.reverse {
      animation: scroll-reverse 30s linear infinite;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes scroll-reverse {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="ribbons" id="ribbons"></div>

  <script>
    function init() {
      const container = document.getElementById('ribbons');
      container.innerHTML = '';
      
      // Calculate ribbon count based on a tighter height to ensure density
      // 2.5rem is approx 40px at 16px root. 
      // We use 45px to keep them fairly tight but legible.
      const ribbonHeight = 45; 
      const ribbonCount = Math.ceil(window.innerHeight / ribbonHeight);

      // We need enough text to cover at least 2x the screen width for smooth infinite scrolling
      // We will perform a rough character width estimation or temp measurement.
      // A safer simpler way is to just repeat enough times based on a conservative guess of char width.
      // Avg char width ~20px? 4k screen width = 3840px. 3840 * 2 / 20 ~ 384 chars.
      // "SHEN NINGSONG " is 14 chars. 384 / 14 ~ 27 repeats. 
      // To be safe for wider screens, let's target coverage of 8000px width.
      
      const targetWidth = Math.max(window.innerWidth * 2.5, 5000); // 2.5x width or at least 5000px
      
      for (let i = 0; i < ribbonCount; i++) {
        const ribbon = document.createElement('div');
        ribbon.className = 'ribbon';

        const scroll = document.createElement('div');
        scroll.className = 'scroll' + (i % 2 === 1 ? ' reverse' : '');

        const baseText = (i % 2 === 0) ? 'SHEN NINGSONG ' : '沈 宁 松 ';
        // Approximate width of baseText to decide repeats
        // If we assume roughly 30px per char (generous) then:
        const estimatedTextWidth = baseText.length * 30; 
        const repeatCount = Math.ceil(targetWidth / estimatedTextWidth) + 5; // +5 for safety

        scroll.innerText = baseText.repeat(repeatCount);

        ribbon.appendChild(scroll);
        container.appendChild(ribbon);
      }
    }

    init();
    window.addEventListener('resize', init);
  </script>
</body>
</html>
