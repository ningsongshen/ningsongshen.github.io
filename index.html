<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ningsong Shen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background-color: #0e0e0e;
      font-family: 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }

    .ribbons {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .ribbon {
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: white;
      font-weight: 300;
      line-height: 1;
    }

    .scroll {
      display: inline-block;
      white-space: nowrap;
      padding-right: 2rem;
      animation: scroll 30s linear infinite;
    }

    .scroll.reverse {
      animation: scroll-reverse 30s linear infinite;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes scroll-reverse {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="ribbons" id="ribbons"></div>

  <script>
    const ribbonCount = Math.ceil(window.innerHeight / 60); // estimate based on ~60px height per ribbon
    const container = document.getElementById('ribbons');

    for (let i = 0; i < ribbonCount; i++) {
      const ribbon = document.createElement('div');
      ribbon.className = 'ribbon';

      const scroll = document.createElement('div');
      scroll.className = 'scroll' + (i % 2 === 1 ? ' reverse' : '');

      const text = (i % 2 === 0) ? 'SHEN NINGSONG ' : '沈 宁 松 ';
      scroll.innerText = text.repeat(20);

      ribbon.appendChild(scroll);
      container.appendChild(ribbon);
    }
  </script>
</body>
</html>
