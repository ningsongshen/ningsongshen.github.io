      font-family: NS, 'Helvetica Neue', Arial, sans-serif;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .ribbons {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      font-size: 2.5rem;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .ribbons.on {
      opacity: 1;
    }

    .ribbon {
      flex: 1;
      display: flex;
      align-items: center;
      contain: strict;
    }

    /* Each row is two identical halves and loops by exactly half its own width, so the seam
       depends only on the browser's own layout. pre keeps the trailing space so the halves match. */
    .scroll {
      flex: none;
      white-space: pre;
    }

    @keyframes s0 {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    @keyframes s1 {
      from {
        transform: translateX(-50%);
      }

      to {
        transform: translateX(0);
      }
    }

    /* duration and delay are set per row from the script */
    @media (prefers-reduced-motion: no-preference) {
      .s0 {
        animation: s0 linear infinite;
      }

      .s1 {
        animation: s1 linear infinite;
      }
    }

    .plate {
      position: fixed;
      right: max(1.5rem, env(safe-area-inset-right));
      bottom: max(1.5rem, env(safe-area-inset-bottom));
      display: flex;
      background: #fff;
      color: #0e0e0e;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      animation: rise 0.8s 0.5s ease-out both;
    }

    .plate a {
      /* trim the right padding by the trailing letter-spacing so labels sit centred */
      padding: 1rem calc(1.1rem - 0.14em) 1rem 1.1rem;
      color: inherit;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.15s, color 0.15s;
    }

    .plate a:hover,
    .plate a:focus-visible {
      background: #0e0e0e;
      color: #fff;
    }

    .plate a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -6px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(0.5rem);
      }
    }

    @media (max-width: 34rem) {
      .plate {
        left: max(1rem, env(safe-area-inset-left));
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(1rem, env(safe-area-inset-bottom));
      }

      .plate a {
        flex: auto;
        padding-left: 0.5rem;
        padding-right: calc(0.5rem - 0.14em);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ribbons,
      .plate {
        transition: none;
        animation: none;
      }
    }
  </style>

<body>

  <script>
    (() => {
      const UNITS = ['SHEN NINGSONG ', '沈 宁 松 '];
      const SPEEDS = [108, 91]; // px/s
      const ROW_HEIGHT = 45;
      const box = document.querySelector('.ribbons');
      const motion = matchMedia('(prefers-reduced-motion: no-preference)');
      const rows = [];
      let widths = [];
      let copies = [];

      // Stable pseudo-random value in [0, 1) per row, so a row keeps its speed and phase across resizes.
      const rand = n => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

      // Width of one unit, used only to pick how many copies to render and how long a loop takes.
      // The loop itself shifts by half the row's own width, so it never depends on this being exact.
      // Returns whether the widths changed.
      function measure() {
        const probe = box.appendChild(document.createElement('span'));
        probe.className = 'scroll';
        probe.style.position = 'absolute';
        const next = UNITS.map((unit, i) => {
          probe.lang = i ? 'zh-Hans' : '';
          probe.textContent = unit.repeat(10);
          return probe.getBoundingClientRect().width / 10;
        });
        probe.remove();
        const changed = next.some((w, i) => w !== widths[i]);
        widths = next;
        return changed;
      }

      // Fill a row with two identical halves and time its loop. Each row gets a slightly different speed
      // and starts at its own phase, far into the timeline so there is room to run backwards when scrolling up.
      // The inline transform only shows when there is no animation (reduced motion): rows hold still at their phase.
      function fill(row) {
        const n = copies[row.kind];
        const duration = n * widths[row.kind] / SPEEDS[row.kind] / row.speed;
        row.el.textContent = UNITS[row.kind].repeat(2 * n);
        row.el.style.animationDuration = duration + 's';
        row.el.style.animationDelay = -(1000 + row.phase) * duration + 's';
        row.el.style.transform = `translateX(${-50 * row.phase}%)`;
        row.anim = null;
      }

      // Rows cover the whole screen, not just the window, so resizing or rotating never changes a loop.
      // Rows are only added or removed at the end, so the rest keep running untouched.
      function layout() {
        const cover = Math.max(innerWidth, screen.width, screen.height);
        const next = widths.map(w => Math.ceil(cover / w));
        const count = Math.ceil(innerHeight / ROW_HEIGHT);
        const changed = next.some((n, i) => n !== copies[i]);
        copies = next;

        while (rows.length > count) rows.pop().el.parentNode.remove();
        if (changed) rows.forEach(fill);

        while (rows.length < count) {
          const n = rows.length;
          const ribbon = document.createElement('div');
          const el = ribbon.appendChild(document.createElement('div'));
          const row = { el, kind: n % 2, speed: 0.9 + 0.2 * rand(n), phase: rand(n + 1000), rate: 1, anim: null };
          ribbon.className = 'ribbon';
          el.className = 'scroll s' + row.kind;
          if (row.kind) el.lang = 'zh-Hans';
          fill(row);
          box.appendChild(ribbon);
          rows.push(row);
        }
      }

      // Rows near the pointer slow down; wheel and swipes push the speed, scrolling up runs them backwards.
      // The loop only runs while rates are still settling, and leaves every rate at exactly 1 when done.
      let pointerY = null;
      let lastY = null;
      let boost = 0;
      let frame = 0;
      let then = 0;

      function tick(now) {
        const dt = then ? Math.min(now - then, 50) : 0;
        const ease = 1 - Math.exp(-dt / 120);
        const h = innerHeight / rows.length;
        then = now;
        boost *= Math.exp(-dt / 400);
        if (Math.abs(boost) < 0.01) boost = 0;
        let busy = boost !== 0;

        rows.forEach((row, i) => {
          let target = 1 + boost;
          if (pointerY !== null) {
            const d = (pointerY - (i + 0.5) * h) / h;
            target *= 1 - 0.8 * Math.exp(-d * d / 2);
          }
          row.rate += (target - row.rate) * ease;
          if (Math.abs(target - row.rate) > 0.002) busy = true;
          else row.rate = target;
          row.anim ||= row.el.getAnimations()[0] || null;
          if (row.anim && row.anim.playbackRate !== row.rate) row.anim.playbackRate = row.rate;
        });

        frame = busy || !dt ? requestAnimationFrame(tick) : 0;
        if (!frame) then = 0;
      }

      const kick = () => {
        if (!frame && motion.matches && rows.length) frame = requestAnimationFrame(tick);
      };

      addEventListener('wheel', e => {
        if (e.ctrlKey) return; // trackpad pinch
        boost = clamp(boost + e.deltaY * (e.deltaMode ? 0.4 : 0.01), -6, 6);
        kick();
      }, { passive: true });

      addEventListener('pointerdown', e => {
        pointerY = lastY = e.clientY;
        kick();
      });

      addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse' && lastY !== null) boost = clamp(boost + (lastY - e.clientY) * 0.03, -6, 6);
        pointerY = lastY = e.clientY;
        kick();
      }, { passive: true });

      const release = () => {
        pointerY = lastY = null;
        kick();
      };
      addEventListener('pointerup', e => e.pointerType !== 'mouse' && release());
      addEventListener('pointercancel', release);
      document.documentElement.addEventListener('pointerleave', release);

      // Animations are created or dropped when the setting flips; forget the old ones.
      motion.addEventListener('change', () => rows.forEach(row => {
        row.anim = null;
        row.rate = 1;
      }));

      let queued = false;
      addEventListener('resize', () => {
        if (queued || !copies.length) return;
        queued = true;
        requestAnimationFrame(() => {
          queued = false;
          layout();
        });
      });

      // Wait for the inlined fonts before measuring; re-time the rows if a font lands later and changes widths.
      const init = () => {
        measure();
        layout();
        box.classList.add('on');
      };
      document.fonts.load('300 1em NS', 'S沈').then(init, init);
      document.fonts.addEventListener('loadingdone', () => {
        if (!copies.length || !measure()) return;
        copies = [];
        layout();
      });
    })();
  </script>
