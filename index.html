<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ningsong Shen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0e0e0e;
    }

    body {
      display: flex;
      flex-direction: column;
      color: #fff;
      font: 300 2.5rem/1 'Helvetica Neue', sans-serif;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .ribbon {
      flex: 1;
      display: flex;
      align-items: center;
      contain: strict;
    }

    /* pre keeps the trailing space, so N copies of a unit are exactly N unit widths */
    .scroll {
      flex: none;
      white-space: pre;
    }
  </style>
</head>
<body>
  <script>
    (() => {
      const UNITS = ['SHEN NINGSONG ', '沈 宁 松 '];
      const SPEEDS = [108, 91]; // px/s
      const ROW_HEIGHT = 45;
      const rows = [];
      let texts = [];

      // Measure each unit once, then loop each row by exactly one unit width.
      // Rows only need to cover the viewport plus one unit, which keeps their layers small.
      const probe = document.createElement('span');
      probe.className = 'scroll';
      probe.style.position = 'absolute';
      document.body.appendChild(probe);
      const widths = UNITS.map(unit => {
        probe.textContent = unit.repeat(10);
        return probe.getBoundingClientRect().width / 10;
      });
      probe.remove();

      const style = document.createElement('style');
      style.textContent =
        `@keyframes s0{to{transform:translateX(-${widths[0]}px)}}` +
        `@keyframes s1{from{transform:translateX(-${widths[1]}px)}}` +
        '@media (prefers-reduced-motion:no-preference){' +
        `.s0{animation:s0 ${widths[0] / SPEEDS[0]}s linear infinite}` +
        `.s1{animation:s1 ${widths[1] / SPEEDS[1]}s linear infinite}}`;
      document.head.appendChild(style);

      // Add or remove rows at the end and only touch text when the needed length changes,
      // so resizing never restarts the animations or rebuilds the page.
      function layout() {
        const next = UNITS.map((unit, i) => unit.repeat(Math.ceil(innerWidth / widths[i]) + 1));
        const count = Math.ceil(innerHeight / ROW_HEIGHT);

        while (rows.length > count) rows.pop().parentNode.remove();
        rows.forEach((row, n) => {
          if (next[n % 2] !== texts[n % 2]) row.textContent = next[n % 2];
        });
        texts = next;

        while (rows.length < count) {
          const ribbon = document.createElement('div');
          const scroll = document.createElement('div');
          ribbon.className = 'ribbon';
          scroll.className = 'scroll s' + (rows.length % 2);
          scroll.textContent = texts[rows.length % 2];
          ribbon.appendChild(scroll);
          document.body.appendChild(ribbon);
          rows.push(scroll);
        }
      }

      let queued = false;
      addEventListener('resize', () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
          queued = false;
          layout();
        });
      });

      layout();
    })();
  </script>
</body>
</html>
