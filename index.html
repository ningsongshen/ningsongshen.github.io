    body {
      height: 100%;
      overflow: hidden;
      color: #fff;
      font-family: NS, 'Helvetica Neue', Arial, sans-serif;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;

    /* the script draws the ribbons into this canvas */
    .canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;

      right: 3rem;
      bottom: calc(1.5rem + var(--step, 0) * 45px);
      height: 45px;

    .gap::before,
    .gap::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3.5rem;
      pointer-events: none;
    }

    .gap::before {
      right: 100%;
      background: linear-gradient(to left, #0e0e0e, rgb(14 14 14 / 0));
    }

    .gap::after {
      left: 100%;

      width: 1.25em;
      height: 1.25em;

  <script>
    (() => {
      const UNITS = ['SHEN NINGSONG ', '沈 宁 松 '];
      const SPEEDS = [108, 91]; // px/s
      const ROW_HEIGHT = 45;
      const SIZE = 40; // px, the 2.5rem the static ribbons use
      const TRACKING = 0.05; // em
      const FONT = 'NS, "Helvetica Neue", Arial, sans-serif';
      const canvas = document.querySelector('.canvas');
      const gaps = document.querySelectorAll('.gap');
      const ctx = canvas.getContext('2d', { alpha: false });
      const motion = matchMedia('(prefers-reduced-motion: no-preference)');
      // One pre-drawn strip per unit, reused across resizes so canvases never pile up.
      const strips = UNITS.map(() => ({ canvas: document.createElement('canvas'), period: 0 }));
      const rows = [];
      let dpr = 0;
      let rowHeight = 0;

      // Stable pseudo-random value in [0, 1) per row, so a row keeps its speed and phase across resizes.
      const rand = n => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

      // Canvas letter-spacing isn't supported everywhere yet; without it, place characters one by one.
      const tracked = 'letterSpacing' in ctx;

      function setFont(c) {
        c.font = `300 ${SIZE * dpr}px ${FONT}`;
        c.textBaseline = 'middle';
        c.fillStyle = '#fff';
        if (tracked) c.letterSpacing = SIZE * TRACKING * dpr + 'px';
      }

      function advance(c, unit) {
        if (tracked) return c.measureText(unit).width;
        return [...unit].reduce((w, ch) => w + c.measureText(ch).width + SIZE * TRACKING * dpr, 0);
      }

      function write(c, unit, x, y) {
        if (tracked) return c.fillText(unit, x, y);
        for (const ch of unit) {
          c.fillText(ch, x, y);
          x += c.measureText(ch).width + SIZE * TRACKING * dpr;
        }
      }

      // Each strip repeats its unit at a whole-pixel period and covers the canvas plus one period,
      // so any canvas-wide window starting inside the first period is seamless by construction.
      function paintStrips(force) {
        strips.forEach((strip, i) => {
          const c = strip.canvas.getContext('2d');
          setFont(c);
          const period = Math.max(1, Math.round(advance(c, UNITS[i])));
          const copies = Math.ceil(canvas.width / period) + 1;
          if (!force && period === strip.period && strip.canvas.width >= copies * period) return;
          strip.period = period;
          strip.canvas.width = copies * period;
          strip.canvas.height = Math.ceil(ROW_HEIGHT * dpr);
          setFont(c); // resizing a canvas resets its context
          for (let k = 0; k < copies; k++) write(c, UNITS[i], k * period, strip.canvas.height / 2);
        });
      }

      function render() {
        ctx.fillStyle = '#0e0e0e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        rows.forEach((row, i) => {
          const strip = strips[row.kind];
          const h = strip.canvas.height;
          const sx = Math.floor(row.offset * strip.period);
          const y = Math.round((i + 0.5) * rowHeight - h / 2);
          ctx.drawImage(strip.canvas, sx, 0, canvas.width, h, 0, y, canvas.width, h);
        });

      // Size the canvas to the window in device pixels. Rows are only added or removed at the end and keep
      // their offsets as fractions of a period, so resizing or a pixel-ratio change never makes them jump.
      function resize(force) {
        const ratio = devicePixelRatio || 1;
        const w = Math.round(innerWidth * ratio);
        const h = Math.round(innerHeight * ratio);
        if (!force && ratio === dpr && w === canvas.width && h === canvas.height) return;
        force = force || ratio !== dpr;
        dpr = ratio;
        canvas.width = w;
        canvas.height = h;
        paintStrips(force);

        const count = Math.ceil(innerHeight / ROW_HEIGHT);
        rowHeight = h / count;
        rows.length = Math.min(rows.length, count);
        while (rows.length < count) {
          const n = rows.length;
          rows.push({ kind: n % 2, speed: 0.9 + 0.2 * rand(n), offset: rand(n + 1000), rate: 1 });
        }

        // The location takes the second-to-last row; each link's notch takes a row further up.
        for (const gap of gaps) {
          const row = Math.max(0, count - 2 - (+gap.style.getPropertyValue('--step') || 0));
          gap.style.top = row * rowHeight / dpr + 'px';
          gap.style.height = rowHeight / dpr + 'px';
          gap.style.bottom = 'auto';
        }
        render();
      }

      // Rows near the pointer slow down; wheel and swipes push the speed, scrolling up runs them backwards.
      let pointerY = null;
      let lastY = null;
      let boost = 0;
      let frame = 0;
      let then = 0;

      function tick(now) {
        const dt = then ? Math.min(now - then, 50) / 1000 : 0;
        const ease = 1 - Math.exp(-dt / 0.12);
        then = now;
        boost *= Math.exp(-dt / 0.4);

        rows.forEach((row, i) => {
          let target = 1 + boost;
          if (pointerY !== null) {
            const d = (pointerY * dpr - (i + 0.5) * rowHeight) / rowHeight;
            target *= 1 - 0.8 * Math.exp(-d * d / 2);
          }
          row.rate += (target - row.rate) * ease;
          const strip = strips[row.kind];
          const step = SPEEDS[row.kind] * dpr * row.speed * row.rate * dt / strip.period;

      };

      addEventListener('pointercancel', release);
      document.documentElement.addEventListener('pointerleave', release);

      motion.addEventListener('change', play);

      addEventListener('resize', () => {

        queued = true;
        requestAnimationFrame(() => {
          queued = false;
          resize(false);
        });
      });

      // Wait for the inlined fonts before drawing; repaint the strips if a font lands later.
      const init = () => {
        resize(true);
        canvas.classList.add('on');
        play();
      };
      document.fonts.load(`300 ${SIZE}px NS`, 'S沈').then(init, init);
      document.fonts.addEventListener('loadingdone', () => {
        if (dpr) resize(true);
      });
    })();
